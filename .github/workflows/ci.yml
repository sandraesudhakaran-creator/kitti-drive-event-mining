name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: End-to-end demo on synthetic KITTI-format data
        run: |
          drive-events synth --out data/synthetic --n 3 --seed 1
          drive-events run --data-root data/synthetic --out outputs/ci \
            --detector ground_truth --max-cards 5
          drive-events evaluate --events outputs/ci/events.csv \
            --truth data/synthetic/truth_events.csv
